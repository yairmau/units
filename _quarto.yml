project:
  type: book
  output-dir: docs

lang: en

babelquarto:
  languagelinks: sidebar
  languagecodes:
    - name: en
      text: English
    - name: he
      text: עברית
  mainlanguage: en
  languages: [he]

title-he: "יחידות"
author-he: "Yair Mau"

book:
  title: "units"
  site-url: https://yairmau.github.io/units/
  author: "Yair Mau"
  repo-url: https://github.com/yairmau/units/
  favicon: archive/logo.png

  chapters:
    - index.qmd
    - intro.qmd
    - basic-concepts.qmd

  sidebar:
    collapse-level: 2
    tools:
      - icon: house-fill
        href: https://yairmau.com/
    logo: archive/logo.png
  search: true

# bibliography: references.bib

format:
  html:
    css: hebrew.css
    theme:
    - flatly
    - custom.scss
    # - font_defs.css
    # css: styles.css
    fontsize: 1.2em
    highlight-style: kate-custom.theme #kate #solarized # kate # tango # breeze # ayu # monokai # breezedark # espresso
    include-in-header:
      - includes.html
    code-line-numbers: true
    code-tools:
      source: repo  # https://quarto.org/docs/output-formats/html-code.html#code-tools
    callout-icon: false
    fig-align: center
    # the default MathJax rendering option yields ugly results, use katex
    html-math-method: katex

  pdf:
    documentclass: scrreprt
    include-in-header:
      - latex_preamble.tex
